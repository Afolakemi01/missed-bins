[project]
name = "missed-bins"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["missed_bins"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
exclude = [".venv"]

[project.scripts]
missed-bins = "missed_bins.missed_bins:main"
